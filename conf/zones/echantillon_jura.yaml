# Zone de l'échantillon du Jura (mission 008) : 6 blocs de 4 x 4 dalles de 1 km, fabriqués hors dépôt
# par scripts/fabriquer_echantillon.py dans /data/echantillon_jura (ignoré par git, non fourni
# aux tests). Même arborescence et mêmes conventions que conf/zones/jeu_essai.yaml.
nom: echantillon-jura  # préfixe de la version des données
source:
  mode: local  # lecture du dossier fabriqué, sans réseau
  racine: /data/echantillon_jura
fichiers:  # relatifs à la racine de la source
  manifeste: manifeste_dalles.parquet
  scenes: sentinel2_scenes.csv
  decoupage: decoupage.yaml
  mnh: "lidar/{dalle}_MNH_2m.tif"
  foret: "foret/{dalle}_bdforet_v2.gpkg"
mnh_unite: cm  # MNH agrégé à 2 m (maximum), uint16 en cm, nodata 65535, comme le jeu d'essai
annees: [2022]  # année de vol des 96 dalles (WFS IGN) ; une dalle n'est traitée que pour son année
foret_formations: tout  # PROVISOIRE : tous les polygones BD Forêt (décision 4, réexamen jalon 3)
# FORMS-T v1, hauteur de l'année de vol, déjà à 10 m, en cm, nodata 65535 (docs/referentiels.md § 11)
references:
  - nom: forms_t_v1
    libelle: FORMS-T v1
    chemin: "references/forms_t_v1/{dalle}_hauteur_{annee}.tif"
    unite: cm
dalles: [  # blocs de conf/echantillon_jura.yaml ; un test vérifie qu'ils sont identiques
  # bloc chaux_a (apprentissage) : chênaie de plaine (forêt de Chaux), 210-260 m
