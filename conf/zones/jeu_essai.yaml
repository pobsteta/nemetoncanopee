# Zone du jeu d'essai embarqué (4 dalles, mission 002). Chemins relatifs à ce fichier.
nom: jeu-essai  # préfixe de la version des données
source:
  mode: local  # lecture du jeu embarqué, sans réseau
  racine: ../../tests/data
fichiers:  # relatifs à la racine de la source
  manifeste: manifeste_dalles.parquet
  scenes: sentinel2_scenes.csv
  decoupage: decoupage.yaml
  mnh: "lidar/{dalle}_MNH_2m.tif"
  mnt: "lidar/{dalle}_MNT_10m.tif"  # relief du modèle gbm (mission 009)
  ortho: "ortho/{dalle}_ortho_10m.tif"  # descripteurs BD ORTHO à 10 m (mission 012), 12 bandes float32
  foret: "foret/{dalle}_bdforet_v2.gpkg"
mnt_unite: m  # unité du MNT si le fichier n'a pas de tag `unite` (mission 009)
mnh_unite: cm  # unité des valeurs du MNH de la zone (jeu d'essai : uint16 en cm, nodata 65535)
dalles: ["0901-6665", "0902-6665", "0939-6654", "0939-6655"]
annees: [2022]
foret_formations: tout  # PROVISOIRE : tous les polygones BD Forêt (décision 4, réexamen jalon 3)
# Références à battre (mission 007), déjà ramenées à la grille (10 m, Lambert-93) et à l'unité
# du projet (uint16, cm, nodata 65535) par scripts/fabriquer_jeu_essai.py ; chemin relatif à la
# racine de la source, gabarits {dalle} et {annee} (année de vol).
references:
  - nom: forms_t_v1
    libelle: FORMS-T v1
    chemin: "references/forms_t_v1/{dalle}_hauteur_{annee}.tif"
    unite: cm
