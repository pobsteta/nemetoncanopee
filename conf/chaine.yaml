# Configuration de la chaîne `canopee` (jalon 1, mission 004).
# Tous les chemins sont relatifs au dossier de ce fichier. Aucun chemin ni seuil n'est écrit
# dans le code : tout ce qui se règle est ici, dans `zones/` ou dans `modele/`.

travail: ../data/travail  # dossier de travail (remplacé par `--travail`) ; /data/ est hors git
graine: 42
zone: zones/jeu_essai.yaml
modele: modele/trivial.yaml

grille:
  crs: "EPSG:2154"  # Lambert-93 partout
  pas_m: 10  # cellules aux bords multiples de 10 m (spec § 2)
  taille_dalle_m: 1000  # dalles LiDAR HD de 1 km, identifiant = coin nord-ouest en km

hauteur:
  couche: hauteur
  unite: cm
  dtype: uint16  # convention FORMS-T v1
  nodata: 65535  # 0 est une hauteur valide (spec § 2)

prepare:
  # Ordre des bandes de la pile Sentinel-2 à 10 m (les bandes à 20 m sont rééchantillonnées
  # au plus proche voisin) ; une dernière bande `clair` vaut 1 si le SCL est bon, 0 sinon.
  bandes: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  bande_scl: SCL
  scl_mauvais: [0, 1, 3, 8, 9, 10, 11]  # sans donnée, saturé, ombre, nuages, cirrus, neige (ESA)

smooth:
  seuil_rupture_cm: 500  # PROVISOIRE, calage au jalon 5 (sans effet au jalon 1 : identité)

cog:
  profil: deflate  # profil rio-cogeo
  predictor: 2
  compression_intermediaire: deflate  # fichiers de travail (infer, smooth, targets…)

stac:
  schemas: stac-schemas  # schémas embarqués, validation sans réseau
  catalogue:
    id: nemeton-canopee
    titre: nemetoncanopee
    description: Cartes annuelles de hauteur forestière à 10 m (jalon 1, modèle trivial).
  licence: other  # en attente de l'ADR 0003 (décision réservée à Pascal)
  liens_licence:
    - titre: Licence Ouverte 2.0 (Etalab), données IGN
      href: https://www.etalab.gouv.fr/wp-content/uploads/2017/04/ETALAB-Licence-Ouverte-v2.0.pdf
    - titre: Legal notice on the use of Copernicus Sentinel Data and Service Information
      href: https://sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice
  mention_copernicus: "Contains modified Copernicus Sentinel data {annee}"  # docs/referentiels.md § 6
  mention_ign: "Licence Ouverte 2.0 (Etalab) ; source : IGN (LiDAR HD, BD Forêt V2)"
  extensions:
    - https://stac-extensions.github.io/projection/v2.0.0/schema.json
    - https://stac-extensions.github.io/raster/v1.1.0/schema.json
    - https://stac-extensions.github.io/file/v2.1.0/schema.json
    - https://stac-extensions.github.io/processing/v1.2.0/schema.json
