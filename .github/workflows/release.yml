name: Release

# La release ne part qu'après la fin VERTE de « CI » sur un push de main :
# workflow_run s'exécute depuis la branche par défaut, sur le head_sha du run de CI.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Tests verts, sur un push de main (jamais une PR, jamais un run rouge ou annulé).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      # On construit exactement le commit que la CI a testé.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Pas de tag ni de release si le commit n'est plus la tête de main, ou si rien du projet
      # (docs et tests exclus) n'a changé depuis le dernier tag v*. Règle : .github/scripts/.
      - name: Décider si une release est nécessaire
        id: decision
        run: |
          RES=$(.github/scripts/release-necessaire.sh "${{ github.event.workflow_run.head_sha }}")
          echo "$RES"
          case "$RES" in
            "pas de release"*) echo "necessaire=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "necessaire=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "### Release : $RES" >> "$GITHUB_STEP_SUMMARY"

      # Version calendaire vAAAA.MM.N (N = compteur du mois, UTC, repart à 1 chaque mois),
      # calculée par .github/scripts/version-calendaire.sh d'après les tags existants ; tag annoté sur head_sha.
      - name: Calculer la version
        id: tag
        if: steps.decision.outputs.necessaire == 'true'
        run: |
          TAG=$(.github/scripts/version-calendaire.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "nemetoncanopee $TAG" "${{ github.event.workflow_run.head_sha }}"
          git push origin "refs/tags/$TAG"
          echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configurer Python 3.11
        if: steps.tag.outputs.new_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # La version du paquet est lue dans le tag git (hatch-vcs) : le tag vient d'être posé sur ce commit.
      - name: Construire le paquet (sdist + wheel)
        if: steps.tag.outputs.new_tag != ''
        run: |
          python -m pip install build
          python -m build
          ls dist/
          ls dist/ | grep -q "${{ steps.tag.outputs.new_version }}"

      - name: Créer la release GitHub
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: nemetoncanopee ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: dist/*
